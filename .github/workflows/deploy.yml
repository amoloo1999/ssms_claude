name: Deploy to MSSQL01

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send deploy command via SSM
        id: ssm
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.MSSQL01_INSTANCE_ID }}" \
            --document-name "AWS-RunPowerShellScript" \
            --comment "Deploy ssms_claude from GitHub Actions" \
            --parameters '{
              "commands": [
                "$ErrorActionPreference = \"Stop\"",
                "Set-Location C:\\ssms_claude",
                "git fetch --all",
                "git reset --hard origin/main",
                "& \"C:\\Python311\\python.exe\" -m pip install --upgrade -r backend\\requirements.txt",
                "Set-Location C:\\ssms_claude\\frontend",
                "npm install --no-audit --no-fund",
                "npm run build",
                "Set-Location C:\\ssms_claude",
                "nssm restart ssms-claude",
                "Start-Sleep -Seconds 3",
                "$s = (Invoke-WebRequest -Uri http://localhost:8080/health -UseBasicParsing -TimeoutSec 10).StatusCode",
                "if ($s -ne 200) { throw \"Health check failed: $s\" }",
                "Write-Host \"Deploy OK\""
              ],
              "executionTimeout": ["600"]
            }' \
            --query "Command.CommandId" --output text)
          echo "cmd_id=$CMD_ID" >> $GITHUB_OUTPUT
          echo "Command ID: $CMD_ID"

      - name: Wait for command to finish
        run: |
          CMD_ID="${{ steps.ssm.outputs.cmd_id }}"
          INSTANCE="${{ secrets.MSSQL01_INSTANCE_ID }}"
          for i in {1..120}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo "Pending")
            echo "[$i] Status: $STATUS"
            case "$STATUS" in
              Success) echo "Deploy succeeded."; break ;;
              Failed|TimedOut|Cancelled)
                echo "=== STDOUT ==="
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query StandardOutputContent --output text
                echo "=== STDERR ==="
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query StandardErrorContent --output text
                exit 1 ;;
            esac
            sleep 5
          done
          echo "=== STDOUT ==="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query StandardOutputContent --output text
